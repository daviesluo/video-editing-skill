<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 906 720" width="906" height="720" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <!-- video-editing skill diagram. Copyright 2026 Zheng Luo (Davies Luo). Licensed under the Apache License 2.0, whose text is the
       LICENSE file shipped beside this file. -->
  <rect width="906" height="720" fill="#ffffff"/>
  <defs>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/>
    </marker>
    <marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a00"/>
    </marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3261e"/>
    </marker>
    <marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a8a5f"/>
    </marker>
  </defs>

  <!-- the owner -->
  <rect x="20" y="14" width="96" height="40" rx="20" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="68" y="40" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">owner</text>
  <text x="132" y="39" font-size="12.5" fill="#57606a">approves each release, and sees nothing before a review of that exact file finds nothing</text>
  <line x1="68" y1="54" x2="68" y2="116" stroke="#8c959f" stroke-width="1.4" marker-end="url(#agrey)"/>
  <text x="76" y="84" font-size="11.5" fill="#57606a">commissions</text>

  <!-- make -->
  <text x="84" y="108" font-size="12.5" font-weight="600" fill="#0b3d7a">MAKE: every fact verified and logged, every time a word cue, never a second</text>
  <g font-size="14" font-weight="700" fill="#0b3d7a" text-anchor="middle">
    <rect x="20" y="118" width="96" height="58" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.6"/>
    <rect x="130" y="118" width="96" height="58" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.6"/>
    <rect x="240" y="118" width="96" height="58" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.6"/>
    <rect x="350" y="118" width="96" height="58" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.6"/>
    <rect x="460" y="118" width="96" height="58" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.6"/>
    <rect x="570" y="118" width="96" height="58" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.6"/>
    <rect x="680" y="118" width="96" height="58" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.6"/>
    <rect x="790" y="118" width="96" height="58" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.6"/>
    <text x="68" y="142">topic</text>
    <text x="178" y="142">research</text>
    <text x="288" y="142">script</text>
    <text x="398" y="142">voice</text>
    <text x="508" y="142">music</text>
    <text x="618" y="142">scenes</text>
    <text x="728" y="142">captions</text>
    <text x="838" y="142">cover</text>
  </g>
  <g font-size="11" fill="#1f2328" text-anchor="middle">
    <text x="68" y="162">one question</text>
    <text x="178" y="162">primary sources</text>
    <text x="288" y="162">read cold</text>
    <text x="398" y="162">force-aligned</text>
    <text x="508" y="162">composed bed</text>
    <text x="618" y="162">follow the words</text>
    <text x="728" y="162">word by word</text>
    <text x="838" y="162">the 3:4 tile</text>
  </g>
  <g stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ablue)">
    <line x1="116" y1="147" x2="129" y2="147"/>
    <line x1="226" y1="147" x2="239" y2="147"/>
    <line x1="336" y1="147" x2="349" y2="147"/>
    <line x1="446" y1="147" x2="459" y2="147"/>
    <line x1="556" y1="147" x2="569" y2="147"/>
    <line x1="666" y1="147" x2="679" y2="147"/>
    <line x1="776" y1="147" x2="789" y2="147"/>
  </g>
  <line x1="838" y1="176" x2="838" y2="246" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ablue)"/>

  <!-- prove, flowing right to left -->
  <text x="20" y="222" font-size="12.5" font-weight="600" fill="#7a4800">PROVE: on the real file, until one exhaustive pass finds nothing</text>
  <rect x="636" y="248" width="250" height="78" rx="10" fill="#fff4e0" stroke="#b26a00" stroke-width="1.8"/>
  <text x="761" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#7a4800">render</text>
  <text x="761" y="294" text-anchor="middle" font-size="11.5" fill="#1f2328">stills first, then the video</text>
  <text x="761" y="312" text-anchor="middle" font-size="11.5" fill="#57606a">on video render helper - 1 and - 2</text>
  <rect x="335" y="248" width="250" height="78" rx="10" fill="#fff4e0" stroke="#b26a00" stroke-width="1.8"/>
  <text x="460" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#7a4800">QA gates</text>
  <text x="460" y="294" text-anchor="middle" font-size="11.5" fill="#1f2328">loudness, alignment, stray sounds, facts,</text>
  <text x="460" y="312" text-anchor="middle" font-size="11.5" fill="#1f2328">orphan and safe-zone scan, picture audit</text>
  <rect x="20" y="248" width="250" height="78" rx="10" fill="#fff4e0" stroke="#b26a00" stroke-width="1.8"/>
  <text x="145" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#7a4800">exhaustive review</text>
  <text x="145" y="294" text-anchor="middle" font-size="11.5" fill="#1f2328">every category in one pass, exact fixes</text>
  <text x="145" y="312" text-anchor="middle" font-size="11.5" fill="#57606a">by video reviewer - 1 or - 2</text>
  <line x1="636" y1="287" x2="586" y2="287" stroke="#b26a00" stroke-width="1.8" marker-end="url(#aamber)"/>
  <line x1="335" y1="287" x2="271" y2="287" stroke="#b26a00" stroke-width="1.8" marker-end="url(#aamber)"/>

  <!-- the fix loop -->
  <polyline points="225,326 225,378 761,378 761,328" fill="none" stroke="#b3261e" stroke-width="1.8" marker-end="url(#ared)"/>
  <text x="493" y="370" text-anchor="middle" font-size="12" fill="#b3261e">anything found: fix all of it, re-render, and the same reviewer re-checks the fixes</text>

  <!-- ship -->
  <line x1="70" y1="326" x2="70" y2="440" stroke="#1a8a5f" stroke-width="1.8" marker-end="url(#agreen)"/>
  <text x="80" y="410" font-size="12" fill="#1a8a5f">a pass finds nothing</text>
  <rect x="20" y="442" width="250" height="64" rx="10" fill="#e8f7f0" stroke="#1a8a5f" stroke-width="1.8"/>
  <text x="145" y="468" text-anchor="middle" font-size="15" font-weight="700" fill="#11593d">release staged</text>
  <text x="145" y="489" text-anchor="middle" font-size="11.5" fill="#1f2328">text and cover checked, hash recorded</text>
  <rect x="335" y="442" width="250" height="64" rx="10" fill="#e8f7f0" stroke="#1a8a5f" stroke-width="1.8"/>
  <text x="460" y="468" text-anchor="middle" font-size="15" font-weight="700" fill="#11593d">owner approves and posts</text>
  <text x="460" y="489" text-anchor="middle" font-size="11.5" fill="#1f2328">from the original file, AI label on</text>
  <rect x="636" y="442" width="250" height="64" rx="10" fill="#e8f7f0" stroke="#1a8a5f" stroke-width="1.8"/>
  <text x="761" y="468" text-anchor="middle" font-size="15" font-weight="700" fill="#11593d">read-back</text>
  <text x="761" y="489" text-anchor="middle" font-size="11.5" fill="#1f2328">the live post compared with the folder</text>
  <line x1="270" y1="474" x2="334" y2="474" stroke="#1a8a5f" stroke-width="1.8" marker-end="url(#agreen)"/>
  <line x1="585" y1="474" x2="635" y2="474" stroke="#1a8a5f" stroke-width="1.8" marker-end="url(#agreen)"/>

  <!-- the repository -->
  <rect x="20" y="528" width="866" height="72" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="2"/>
  <text x="453" y="556" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2328">the project repository, where every step leaves its record</text>
  <text x="453" y="580" text-anchor="middle" font-size="12" fill="#57606a">episode.json, research.md, verification.md, picture-audit.md, the committed take and timeline, covers, release folders, a ledger</text>

  <!-- the agents -->
  <rect x="20" y="616" width="866" height="88" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="38" y="640" font-size="12.5" font-weight="600" fill="#1f2328">named sub-agents, reused by message so their context is not rebuilt:</text>
  <text x="38" y="660" font-size="12.5" fill="#1f2328">video researcher, video fact checker, video script editor, video designer, video release writer (the main session's model, high effort);</text>
  <text x="38" y="678" font-size="12.5" fill="#1f2328">video reviewer - 1 and - 2 (same model, high effort); video chores (same model, low effort). At most three at a time.</text>
  <text x="38" y="696" font-size="12.5" fill="#57606a">Standing render sessions, created once where the platform has them and reused for every render: video render helper - 1 and - 2.</text>
</svg>
